# Fetch the upstream must-gather and keep this fork current.
#
# Opens a sync PR when main lags upstream/main. Release-branch sync is
# disabled: upstream has no 4.18+ release lines to backport onto.
#
# Does not auto-merge. Image publishes stay on ci.yml.

name: sync-upstream

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all origin branches
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_URL: https://github.com/kubevirt/must-gather.git
          IMAGE_NAME: better-gather-cnv
          ENABLE_RELEASE_SYNC: "0"
        run: ./hack/sync-upstream.sh
